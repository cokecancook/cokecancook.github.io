<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <title>Coding Playground</title>
  </head>

  <body>
    <div id="overlay"></div>
    <h1 class="urbanist-regular">Coding Playground</h1>
    <p class="urbanist-regular">HTML, CSS, and JavaScript</p>

    <img class="qr-code" src="./images/qr-code.svg" alt="qr-code" />
    <p class="urbanist-regular qr-footer">Scan to view in mobile for<br> automated simulated hover animations</p>

    <div class="links">
      <ul>
        <li id="li1">
          <a href="/qr-code">QR Code</a>
        </li>
        <li id="li2">
          <a href="/blog-preview-card">Blog Preview Card</a><img class="icon-animation" src="./images/icon-animation.svg" alt="animation">
        </li>
        <li id="li3">
          <a href="/social-links-profile">Social Links Profile</a><img class="icon-animation" src="./images/icon-animation.svg" alt="animation">
        </li>
        <li id="li4">
          <a href="/recipe-page">Recipe Page</a>
        </li>
        <li id="li5">
          <a href="/product-preview-card">Product Preview Card</a>
        </li>
        <li id="li6">
          <a href="/features-section">Features Section</a><img class="icon-animation" src="./images/icon-animation.svg" alt="animation">
        </li>
        <li id="li7">
          <a href="/testimonials-grid">Testimonials Grid</a>
        </li>
        <li id="li8">
          <a href="/nft-preview-card">NFT Preview Card</a><img class="icon-animation" src="./images/icon-animation.svg" alt="animation">
        </li>
      </ul>
    </div>
    <script>
      window.onload = setTimeout(function () {
        document.getElementById("overlay").style.display = "none";
      }, 500);
    </script>
  </body>
</html>
