<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./styles.css" />
    
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <title>Coke Stuyck | Designer & AI Specialist</title>
  </head>

  <body>
    <div id="overlay"></div>
    <main>
      <header>
        <h1>Coke Stuyck</h1>
        <p>Designer & AI Specialist</p>
      </header>

      <nav>
        <ul>
          <li>
            <a href="https://github.com/cokecancook/AI-Master-Projects-Hub/">
              AI Projects
            </a>
          </li>
          <li>
            <a href="https://cokestuyck.webflow.io/">Portfolio Website</a>
          </li>
          <li>
            <a href="https://www.behance.net/cokestuyck">Behance</a>
          </li>
          <li>
            <a href="https://www.figma.com/@cokestuyck">Figma</a>
          </li>
          <li>
            <a href="https://www.linkedin.com/in/cokestuyck/">Linkedin</a>
          </li>
          <li>
            <a href="https://github.com/cokecancook">Github</a>
          </li>
        </ul>
      </nav>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          document.getElementById("overlay").style.display = "none";
        }, 500);

        const listItems = document.querySelectorAll("nav ul li a");
        listItems.forEach((item, index) => {
          item.style.animationDelay = `${2 + index * 0.2}s`;
        });
      });
    </script>
  </body>
</html>
